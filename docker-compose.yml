services:
  campusassist:
    build:
      context: .
      dockerfile: Dockerfile
    image: campusassist-ai:latest
    container_name: campusassist-ai
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CampusAssist AI
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-minicpm-v4.6:1b}
      - DATA_DIR=data
      - VECTOR_STORE_DIR=data/vectorstore
      - CHROMA_COLLECTION=campusassist_faq
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - RETRIEVAL_MAX_DISTANCE=0.75
      - RETRIEVAL_TOP_K=4
    volumes:
      - chroma_data:/app/data/vectorstore
    restart: unless-stopped

volumes:
  chroma_data:
    name: campusassist_chroma_data
