[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campusassist-ai"
version = "1.0.0"
description = "Institutional AI Assistant and Grounded RAG for Madhav Institute of Technology & Science"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.3.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
