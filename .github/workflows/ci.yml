name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security and Hygiene Check (Verify no committed secrets)
        run: |
          # Ensure sensitive files are never committed
          test ! -f .env || (echo "ERROR: .env file detected in working tree!" && exit 1)
          test ! -f google_client_secret.json || (echo "ERROR: google_client_secret.json detected!" && exit 1)

      - name: Run Pytest Suite
        env:
          APP_ENV: testing
          HF_HUB_OFFLINE: "1"
        run: |
          pytest -v
